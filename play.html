<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131d">
  <meta name="description" content="台籃模擬器網頁版：橫向全畫面組隊、球探與挑戰聯賽。">
  <title>立即遊玩｜台籃模擬器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02070b; color: #eaf2f5; font-family: system-ui, sans-serif; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    button, a { font: inherit; color: inherit; }
    button { cursor: pointer; border: 1px solid #d0ad6570; border-radius: 12px; background: #102633; padding: 10px 16px; min-height: 44px; }
    button:focus-visible, a:focus-visible { outline: 2px solid #55d8cf; outline-offset: 3px; }
    #tools { position: fixed; z-index: 3; right: max(0px, env(safe-area-inset-right)); bottom: max(0px, env(safe-area-inset-bottom)); }
    #tools-toggle { padding: 0; width: 44px; background: #07131dbb; border-radius: 12px 0 0 0; }
    #tools-panel { position: absolute; right: 4px; bottom: 50px; width: 220px; padding: 14px; border: 1px solid #d0ad6570; border-radius: 14px; background: #07131df5; box-shadow: 0 6px 24px #0009; }
    #tools-panel button, #tools-panel a { display: block; width: 100%; text-align: center; margin: 5px 0; }
    #tools-panel a { padding: 12px; }
    #fullscreen-note { margin: 8px 0 0; font-size: 13px; color: #bdd0d9; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 4; padding: 28px; align-items: center; justify-content: center; background: radial-gradient(ellipse at top, #183c4e, #02070bf5 70%); text-align: center; }
    #rotate > div { max-width: 340px; }
    #rotate h1 { color: #f2cc76; font-size: 26px; }
    #rotate p { line-height: 1.7; color: #bdced8; }
    .phone { font-size: 64px; line-height: 1; }
    [hidden] { display: none !important; }
    @media (orientation: portrait) and (max-width: 1024px) { #rotate:not([hidden]) { display: flex; } }
  </style>
</head>
<body>
  <main id="game" aria-label="台籃模擬器遊戲">
    <iframe id="game-frame" src="game/index.html?v=135" title="台籃模擬器" allow="fullscreen; autoplay" allowfullscreen></iframe>
  </main>
  <aside id="tools" aria-label="網頁工具">
    <div id="tools-panel" hidden>
      <button id="fullscreen" type="button">進入全螢幕</button>
      <a href="index.html" target="_blank" rel="noopener">開啟官網與下載資訊 ↗</a>
      <p id="fullscreen-note" role="status">回到遊戲請收起工具。離開前可至遊戲設定確認同步。</p>
    </div>
    <button id="tools-toggle" type="button" aria-label="展開網頁工具" aria-expanded="false" aria-controls="tools-panel">⛶</button>
  </aside>
  <section id="rotate" aria-labelledby="rotate-title">
    <div>
      <div class="phone" aria-hidden="true">↻ ▭</div>
      <h1 id="rotate-title">橫過來，完整上場</h1>
      <p>請關閉手機的直向鎖定，將裝置轉為橫向。遊戲會填滿可用畫面，球員與按鈕也更好操作。</p>
      <button id="portrait-continue" type="button">先用目前方向進入</button>
    </div>
  </section>
  <script>
    (() => {
      const panel = document.getElementById('tools-panel');
      const toggle = document.getElementById('tools-toggle');
      const fullscreen = document.getElementById('fullscreen');
      const note = document.getElementById('fullscreen-note');
      const frame = document.getElementById('game-frame');
      function closeTools() {
        panel.hidden = true;
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', '展開網頁工具');
      }
      toggle.addEventListener('click', () => {
        panel.hidden = !panel.hidden;
        toggle.setAttribute('aria-expanded', String(!panel.hidden));
        toggle.setAttribute('aria-label', panel.hidden ? '展開網頁工具' : '收起網頁工具');
        if (panel.hidden) frame.focus();
      });
      document.getElementById('portrait-continue').addEventListener('click', () => {
        document.getElementById('rotate').hidden = true;
        frame.focus();
      });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeTools(); });
      document.addEventListener('fullscreenchange', () => {
        fullscreen.textContent = document.fullscreenElement ? '離開全螢幕' : '進入全螢幕';
      });
      fullscreen.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
            if (screen.orientation?.lock) await screen.orientation.lock('landscape').catch(() => {});
          } else {
            note.textContent = '這個瀏覽器不支援全螢幕按鈕。請橫放手機，並收起瀏覽器工具列；遊戲已填滿可用頁面。';
            return;
          }
          closeTools();
          frame.focus();
        } catch (_) {
          note.textContent = '瀏覽器未允許全螢幕，遊戲仍可正常操作。請橫放裝置，或使用 Safari／Chrome 開啟。';
        }
      });
    })();
  </script>
</body>
</html>
